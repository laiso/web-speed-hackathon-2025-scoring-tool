name: Request
on:
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      application_url:
        description: '計測対象の URL（例: http://3.82.52.58:8002）'
        required: true
        type: string
env:
  TZ: 'Asia/Tokyo'
jobs:
  register:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    if: |
      contains(github.event.issue.labels.*.name, 'registration') && (
        (github.event_name == 'issues') || (
          github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/retry') &&
          (github.actor == github.event.issue.user.login)
        )
      )
    steps:
      - if: github.event_name == 'issues'
        run: |
          gh api -X POST repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions -f content=+1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'issue_comment'
        run: |
          gh api -X POST repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f content=+1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-murray/issue-forms-body-parser@22e5d90e6a607073d08891bc036461971cbcfb45 # renovate: tag=v4.2.1
        id: issue-parsed
        with:
          issue_id: ${{ github.event.issue.number }}
          label_marker_start: '{{'
          label_marker_end: '}}'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # renovate: tag=v4.2.2
        with:
          fetch-depth: 0
      - run: |
          curl https://mise.run | sh
          echo "$HOME/.local/share/mise/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          mise install
        env:
          MISE_VERSION: '2025.3.2'
      - run: |
          pnpm install --frozen-lockfile
      - run: |
          pnpm start --applicationUrl ${TARGET_URL}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: 'Asia/Tokyo'
          TARGET_URL: ${{ fromJSON(steps.issue-parsed.outputs.payload).url }}

  dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # renovate: tag=v4.2.2
        with:
          fetch-depth: 0
      - run: |
          curl https://mise.run | sh
          echo "$HOME/.local/share/mise/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          mise install
        env:
          MISE_VERSION: '2025.3.2'
      - run: |
          pnpm install --frozen-lockfile
      - run: |
          google-chrome --version || true
          nproc; free -g | head -2
          echo "scoring start: $(date -Is)"
          # GITHUB_ACTIONS が設定されていると GitHubWriter（Issue 前提）が使われて失敗するので、
          # dispatch 実行では外して CLIWriter に出力させる
          env -u GITHUB_ACTIONS -u GITHUB_TOKEN pnpm start --applicationUrl "${TARGET_URL}"
          echo "scoring end: $(date -Is)"
        env:
          TZ: 'Asia/Tokyo'
          TARGET_URL: ${{ inputs.application_url }}
